name: Generate profile stat cards

on:
  schedule:
    - cron: '10 12 * * *' # after the daily README refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG (self-hosted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          user = "yunaremaia"
          api = lambda path: json.loads(subprocess.run(
              ["curl", "-sfL", "-H", f"Authorization: Bearer {token}",
               "-H", "Accept: application/vnd.github+json",
               f"https://api.github.com{path}"],
              capture_output=True, text=True).stdout or "{}")

          profile = api(f"/users/{user}")
          repos = []
          page = 1
          while page <= 3:
              batch = api(f"/users/{user}/repos?per_page=100&page={page}")
              if not isinstance(batch, list) or not batch:
                  break
              repos += batch
              page += 1
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)

          contribs = api(f"/search/issues?q=author:{user}+is:pr+is:merged&per_page=1")
          merged_prs = contribs.get("total_count", 0)

          followers = profile.get("followers", 0)
          public_repos = profile.get("public_repos", len(repos))
          joined = (profile.get("created_at") or "")[:10]

          svg = f'''<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub statistics">
            <style>
              .header {{ font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2F80ED }}
              .stat {{ font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333 }}
              .label {{ font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585 }}
              .card {{ fill: #FFFEFE; stroke: #E4E2E2 }}
              @media (prefers-color-scheme: dark) {{
                .header {{ fill: #4C8BFF }}
                .stat {{ fill: #E6EDF3 }}
                .label {{ fill: #8B949E }}
                .card {{ fill: #0D1117; stroke: #30363D }}
              }}
            </style>
            <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" class="card"/>
            <text x="25" y="35" class="header">Yunare Maia's GitHub Stats</text>
            <text x="25" y="70" class="stat">{public_repos}</text><text x="90" y="70" class="label">Public repositories</text>
            <text x="250" y="70" class="stat">{followers}</text><text x="320" y="70" class="label">Followers</text>
            <text x="25" y="105" class="stat">{stars}</text><text x="90" y="105" class="label">Stars earned</text>
            <text x="250" y="105" class="stat">{merged_prs}</text><text x="320" y="105" class="label">Merged PRs</text>
            <text x="25" y="140" class="stat">{forks}</text><text x="90" y="140" class="label">Forks of my repos</text>
            <text x="250" y="140" class="stat">since {joined}</text><text x="360" y="140" class="label">on GitHub</text>
            <text x="25" y="175" class="label">Generated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')} · self-hosted · always fresh</text>
          </svg>'''

          with open("stats.svg", "w") as f:
              f.write(svg)
          print("stats.svg written")
          PY

      - name: Fetch contribution streak and bake in the dark palette
        run: |
          curl -sfL --max-time 60 \
            "https://streak-stats.demolab.com?user=yunaremaia&hide_border=true&locale=en" \
            -o streak-src.svg

          python3 - <<'PY'
          # The upstream SVG hard-codes light colors in single-quoted inline
          # attributes. Palette inspected from a live fetch: card bg #FFFEFE,
          # numbers/text #151515, labels/dates #464646, flame #FB8C00.
          # Swap them for GitHub-dark equivalents so the committed file reads
          # correctly on dark profiles; camo never proxies it because the file
          # lives in this repo and the README references it relatively.
          svg = open("streak-src.svg").read()

          DARK = {
              "#FFFEFE": "#0D1117",  # card background
              "#151515": "#E6EDF3",  # big numbers / primary text
              "#464646": "#8B949E",  # labels / dates
              "#FB8C00": "#F0883E",  # flame orange -> github orange
          }
          for light, dark in DARK.items():
              svg = svg.replace(light, dark)

          open("streak.svg", "w").write(svg)
          print("streak.svg written with GitHub-dark palette baked in")
          PY

          rm -f streak-src.svg

      - name: Commit refreshed cards
        run: |
          git config user.name "Yunare Maia"
          git config user.email "yunare@gmail.com"
          git add stats.svg streak.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -q -s -m "docs(profile): refresh self-hosted stat cards"
            git push
          fi
